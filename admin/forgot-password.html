<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>Mot de passe oublié</title>
    </head>

    <body>

        <h1>Mot de passe oublié</h1>

        <p>
            Entrez votre email administrateur.
            Un lien de réinitialisation vous sera envoyé.
        </p>

        <form id="forgotPasswordForm">
            <input type="email" id="forgotEmail" placeholder="Email administrateur" required>

            <button type="submit">
                Envoyer le lien
            </button>
        </form>

        <p id="forgotPasswordMessage"></p>

        <p>
            <a href="login.html">Retour à la connexion</a>
        </p>

        <script src="./js/admin.js"></script>

    </body>

</html>
