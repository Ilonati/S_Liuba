<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>Nouveau mot de passe</title>
        <link rel="stylesheet" href="./css/auth.css">
    </head>

    <body>
        <div class="auth-card">
            <h1>Créer un nouveau mot de passe</h1>

            <form id="resetPasswordForm">
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe" required>

                <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" required>

                <button type="submit">
                    Enregistrer
                </button>
            </form>

            <p id="resetPasswordMessage"></p>

            <p>
                <a href="login.html">Retour à la connexion</a>
            </p>
        </div>
        <script src="./js/admin.js"></script>

    </body>

</html>
